name: Build helpexpert.me

on:
  push:
    branches: [main, develop]
    paths:
      - 'sites/helpexpert.me/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-helpexpert-me.yml'
      - '.github/workflows/reusable-site-build.yml'
  pull_request:
    paths:
      - 'sites/helpexpert.me/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-helpexpert-me.yml'
      - '.github/workflows/reusable-site-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-site-build.yml
    with:
      domain: helpexpert.me
