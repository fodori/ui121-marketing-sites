name: Build generatedui.app

on:
  push:
    branches: [main, develop]
    paths:
      - 'sites/generatedui.app/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-generatedui-app.yml'
      - '.github/workflows/reusable-site-build.yml'
  pull_request:
    paths:
      - 'sites/generatedui.app/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-generatedui-app.yml'
      - '.github/workflows/reusable-site-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-site-build.yml
    with:
      domain: generatedui.app
