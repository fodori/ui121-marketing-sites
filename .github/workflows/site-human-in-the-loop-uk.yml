name: Build human-in-the-loop.uk

on:
  push:
    branches: [main, develop]
    paths:
      - 'sites/human-in-the-loop.uk/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-human-in-the-loop-uk.yml'
      - '.github/workflows/reusable-site-build.yml'
  pull_request:
    paths:
      - 'sites/human-in-the-loop.uk/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-human-in-the-loop-uk.yml'
      - '.github/workflows/reusable-site-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-site-build.yml
    with:
      domain: human-in-the-loop.uk
