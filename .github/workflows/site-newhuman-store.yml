name: Build newhuman.store

on:
  push:
    branches: [main, develop]
    paths:
      - 'sites/newhuman.store/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-newhuman-store.yml'
      - '.github/workflows/reusable-site-build.yml'
  pull_request:
    paths:
      - 'sites/newhuman.store/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-newhuman-store.yml'
      - '.github/workflows/reusable-site-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-site-build.yml
    with:
      domain: newhuman.store
