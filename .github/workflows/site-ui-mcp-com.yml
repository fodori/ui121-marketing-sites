name: Build ui-mcp.com

on:
  push:
    branches: [main, develop]
    paths:
      - 'sites/ui-mcp.com/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-ui-mcp-com.yml'
      - '.github/workflows/reusable-site-build.yml'
  pull_request:
    paths:
      - 'sites/ui-mcp.com/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-ui-mcp-com.yml'
      - '.github/workflows/reusable-site-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-site-build.yml
    with:
      domain: ui-mcp.com
