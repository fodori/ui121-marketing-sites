name: Build generativeui.uk

on:
  push:
    branches: [main, develop]
    paths:
      - 'sites/generativeui.uk/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-generativeui-uk.yml'
      - '.github/workflows/reusable-site-build.yml'
  pull_request:
    paths:
      - 'sites/generativeui.uk/**'
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/site-generativeui-uk.yml'
      - '.github/workflows/reusable-site-build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/reusable-site-build.yml
    with:
      domain: generativeui.uk
